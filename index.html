<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#181A20" />
  <meta name="description" content="Explore EdFi, a Learn-to-Earn concept for universities on BNB Chain. Try sample rewards and campus payments in the web demo. No wallet is connected or real funds sent." />
  <title>EdFi | Learn-to-Earn on BNB Chain</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EdFi" />
  <meta property="og:title" content="EdFi | Learn-to-Earn on BNB Chain" />
  <meta property="og:description" content="A Learn-to-Earn concept with an interactive web demo. 1st place, Crypto Ideathon Kazakhstan by Binance. Independent project; no live pilot or deployed token." />
  <meta property="og:url" content="https://ed-fi.vercel.app" />
  <meta property="og:image" content="https://ed-fi.vercel.app/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    // Apply the saved theme before first paint (dark is the default, as on binance.com).
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('edfi-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
      document.documentElement.dataset.theme = t;
      if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF');
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
